apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodgram-ingress
  namespace: {{ include "foodgram.namespace" . }}
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
  annotations:
    # nginx-ingress controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Увеличиваем лимит для загрузки изображений рецептов
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # Таймауты для Django
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    # Метрики: разрешаем Prometheus-autodiscovery для этого ingress
    nginx.ingress.kubernetes.io/enable-access-log: "true"
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
