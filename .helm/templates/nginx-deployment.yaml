apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ include "foodgram.namespace" . }}
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      {{- include "foodgram.nginx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foodgram.nginx.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: {{ index .Values.werf.image "nginx" }}
          imagePullPolicy: {{ .Values.nginx.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # Frontend build (из Job)
            - name: frontend-build
              mountPath: /usr/share/nginx/html
            # Django static
            - name: static
              mountPath: /app/static
            # Media (user uploads)
            - name: media
              mountPath: /app/media
            # Nginx конфиг из ConfigMap
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: frontend-build
          persistentVolumeClaim:
            claimName: frontend-build-pvc
        - name: static
          persistentVolumeClaim:
            claimName: static-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: nginx-config
          configMap:
            name: nginx-config
