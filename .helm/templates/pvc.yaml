    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.frontendBuild.size }}
  storageClassName: {{ .Values.persistence.frontendBuild.storageClass }}
