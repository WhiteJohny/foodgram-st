name: Foodgram CI/CD Pipeline

on:
  push:
    branches: [main, helm2]
  pull_request:
    branches: [main, helm2]

# semantic-release needs write access to create tags and GitHub Releases
permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: foodgram-backend
  FRONTEND_IMAGE: foodgram-frontend
  NGINX_IMAGE: foodgram-nginx
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,host.docker.internal

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django tests with pytest
      working-directory: ./backend
      env:
        DATABASE_URL: postgres://test_user:test_pass@postgres:5432/test_db
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DEBUG: "False"
      run: |
        python manage.py migrate
        pytest

    - name: Lint with flake8
      run: |
        flake8

  # Determines the next semantic version and creates a git tag + GitHub Release.
  # Runs only on direct pushes to main (not PRs).
  # Commit message prefixes drive the version bump:
  #   fix:     → patch  (1.0.0 → 1.0.1)
  #   feat:    → minor  (1.0.0 → 1.1.0)
  #   BREAKING CHANGE in footer → major (1.0.0 → 2.0.0)
  release:
    needs: test-backend
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/helm2') && github.event_name == 'push'
    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Full history required by semantic-release to calculate the next version
        fetch-depth: 0

    - name: Run semantic-release
      id: semantic_release
      uses: cycjimmy/semantic-release-action@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds and pushes Docker images only when semantic-release published a new version.
  # Each image gets two tags: the exact semver and :latest.
  #
  # To run this job on your self-hosted ARC runner instead of GitHub-hosted machines,
  # change `runs-on` below to:
  #   runs-on: [self-hosted, foodgram-runner]
  # after deploying the runner (see runners/ directory).
  build-and-push:
    needs: release
    runs-on: foodgram-runner
    if: needs.release.outputs.new_release_published == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
          ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ needs.release.outputs.new_release_version }}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ needs.release.outputs.new_release_version }}

    - name: Build and push nginx image
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        file: ./nginx/Dockerfile
        push: true
        tags: |
          ${{ env.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE }}:latest
          ${{ env.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE }}:${{ needs.release.outputs.new_release_version }}

  # Builds images with werf and deploys to Kubernetes via werf converge.
  # Docker credentials are fetched from Vault at deploy time.
  deploy:
    needs: [release, build-and-push]
    runs-on: foodgram-runner
    if: needs.release.outputs.new_release_published == 'true'
    env:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      NAMESPACE: foodgram

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install werf
      uses: werf/actions/install@v2

    - name: werf ci-env (sets WERF_REPO, registry auth, etc.)
      run: source $(werf ci-env github --as-file)
      shell: bash

    - name: Deploy via Vault integration script
      run: bash scripts/vault-deploy.sh production
      shell: bash
