replicaCount: 1

image:
  repository: redislabs/redisinsight
  tag: 1.14.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8001

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: redisinsight.local
      paths:
        - /
  tls: []

volume:
  enabled: true
  size: 1Gi
  storageClass: "standard"
  accessModes:
    - ReadWriteOnce

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
