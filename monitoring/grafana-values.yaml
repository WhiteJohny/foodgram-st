assertNoLeakedSecrets: false

adminUser: admin

adminPassword: "foodgram-grafana-2026"

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - grafana.foodgram.local
  paths:
    - /
  pathType: Prefix

persistence:
  enabled: true
  size: 2Gi
  storageClass: standard

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        access: proxy
        editable: true

      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        editable: true

grafana.ini:
  server:
    root_url: http://grafana.foodgram.local

  smtp:
    enabled: true
    host: smtp.yandex.ru:465
    user: eakiselev@kpfu.ru
    password: droakwitvikzzuyp
    from_address: eakiselev@kpfu.ru
    from_name: "Grafana | Foodgram"
    skip_verify: true

  unified_alerting:
    enabled: true

  alerting:
    enabled: false

  auth.anonymous:
    enabled: false
