apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: foodgram
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10M;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri @backend_static;
            expires 1y;
            add_header Cache-Control "public";
        }

        location @backend_static {
            internal;
            rewrite ^/static/(.*)$ /$1 break;
            root /app/static;
            expires 1y;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /app/media/;
            expires 1y;
            add_header Cache-Control "public";
        }

        location /api/ {
            proxy_set_header Host $http_host;
            proxy_pass http://backend-service:8000/api/;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PATCH';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        }

        location /admin/ {
            proxy_set_header Host $http_host;
            proxy_pass http://backend-service:8000/admin/;
        }

        location /r/ {
            proxy_set_header Host $http_host;
            proxy_pass http://backend-service:8000/r/;
        }

        location /api/docs/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /redoc.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
