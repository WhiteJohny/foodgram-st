# Default values for foodgram-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Основные параметры приложения
backend:
  configMap:
    data:
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "foodgram"
      DB_USER: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
  replicaCount: 2
  image:
    repository: santino9/foodgram-backend
    tag: latest
    pullPolicy: Always
  service:
    port: 8000
    type: ClusterIP
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Секреты
secret:
  DB_PASSWORD: ""
  SECRET_KEY: ""

# Параметры nginx
nginx:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.25.4-alpine"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Постоянные тома
persistence:
  static:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce
    storageClass: "standard"
    existingClaim: ""
  media:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce
    storageClass: "standard"
    existingClaim: ""
  frontendStatic:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: "standard"
    existingClaim: ""

# Job для сборки фронтенда
frontendJob:
  enabled: true
  image:
    repository: santino9/foodgram-frontend
    tag: latest
  command: |
    npm install && npm run build
    cp -r /app/build/* /frontend-static/

# Ingress
ingress:
  enabled: true
  ingressClassName: nginx
  annotations: {}
  tls:
    - hosts:
        - foodgram.local
      secretName: foodgram-tls
  hosts:
    - host: foodgram.local
      paths:
        - path: /
          pathType: Prefix

# Подчарт PostgreSQL
postgresql:
  enabled: true
  database:
    name: foodgram
    user: postgres
    password: ""
  persistence:
    size: 2Gi
    storageClass: "manual"
  image:
    repository: postgres
    tag: "17"

httpRoute:
  enabled: false

rabbitmq:
  username: ""
  password: ""
  host: "my-rabbitmq.default.svc.cluster.local"
  port: 5672
  secretName: rabbitmq-secrets
  userKey: username
  passwordKey: password

nyt:
  apiKey: ""
  secretName: nyt-secret
  apiKeyKey: NYT_API_KEY

workers:
  foodish:
    enabled: true
    replicaCount: 1
    queue: foodish_tasks
    outputDir: /output/foodish
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  nyt:
    enabled: true
    replicaCount: 1
    queue: nyt_tasks
    outputDir: /output/nyt
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
