namespace: foodgram

# Backend (Django)
backend:
  image: docker.io/santino9/foodgram-backend:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 150m       # стабильная нагрузка ~120m
      memory: 200Mi   # пик 190Mi
    limits:
      cpu: 600m       # пик 291m * 2 — запас на спайки
      memory: 384Mi
  # Несекретные env-переменные Django
  env:
    DJANGO_DEBUG: "False"
    DB_ENGINE: django.db.backends.postgresql
    DB_HOST: foodgram-postgresql
    DB_PORT: "5432"
    DJANGO_ALLOWED_HOSTS: "*"

# Frontend Job (npm run build)
frontend:
  image: docker.io/santino9/foodgram-frontend:latest
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Nginx
nginx:
  image: docker.io/santino9/foodgram-nginx:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Ingress
ingress:
  host: foodgram.local        # замени на свой домен
  tlsSecretName: foodgram-tls # kubectl create secret tls ...

# Persistent Volumes
persistence:
  static:
    size: 1Gi
    storageClass: standard
  media:
    size: 2Gi
    storageClass: standard
  frontendBuild:
    size: 500Mi
    storageClass: standard

# Vault + External Secrets Operator
vault:
  address: "http://vault.vault.svc.cluster.local:8200"
  role: "foodgram-role"
  # путь к секретам в Vault (kv-v2: реальный путь будет foodgram/data/app)
  secretPath: "foodgram/data/app"

externalSecrets:
  # имя K8s Secret который создаст ESO
  secretName: foodgram-secrets
  # как часто ESO синхронизирует секреты из Vault
  refreshInterval: "1h"

# ServiceAccount для Vault Kubernetes auth
serviceAccount:
  name: vault-auth

# Bitnami PostgreSQL subchart
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  enabled: true
  auth:
    existingSecret: foodgram-secrets
    secretKeys:
      adminPasswordKey: DB_PASSWORD
      userPasswordKey: DB_PASSWORD
      replicationPasswordKey: DB_PASSWORD
    # username и database задаются через секрет напрямую в initdb,
    # либо явно здесь (не секретные данные можно оставить):
    username: foodgram_user
    database: foodgram_db
  primary:
    resources:
      requests:
        cpu: 100m     # стабильная нагрузка ~100m
        memory: 64Mi
      limits:
        cpu: 300m     # пик 158m * 2
        memory: 128Mi
    persistence:
      enabled: true
      size: 1Gi
      storageClass: standard
      podSecurityContext:
        enabled: true
        fsGroup: 1001
      containerSecurityContext:
        enabled: true
        runAsUser: 1001
        runAsNonRoot: true
    initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: [ "sh", "-c", "chown -R 1001:1001 /bitnami/postgresql" ]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: data
            mountPath: /bitnami/postgresql
  image:
    pullPolicy: IfNotPresent
    tag: latest
