apiVersion: batch/v1
kind: Job
metadata:
  name: frontend-build
  namespace: {{ include "foodgram.namespace" . }}
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
  annotations:
    # Пересоздаём Job при каждом helm upgrade
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Автоматически удалить Job через 10 минут после завершения
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foodgram.name" . }}-frontend-build
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Очищаем старый билд перед новой сборкой
        - name: clean-build
          image: busybox:1.36
          command: ["sh", "-c", "rm -rf /app/build/* && echo 'Build dir cleaned'"]
          volumeMounts:
            - name: frontend-build
              mountPath: /app/build
      containers:
        - name: frontend-build
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          # Строим и копируем результат в shared PVC
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> Installing dependencies..."
              npm install
              echo "==> Building frontend..."
              npm run build
              echo "==> Copying build to shared volume..."
              cp -r /app/build/. /output/
              echo "==> Frontend build complete!"
              ls -la /output/
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: frontend-build
              mountPath: /output
      volumes:
        - name: frontend-build
          persistentVolumeClaim:
            claimName: frontend-build-pvc
