apiVersion: batch/v1
kind: Job
metadata:
  name: frontend-build
  namespace: {{ include "foodgram.namespace" . }}
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
  annotations:
    # Job запускается как hook ПОСЛЕ того как обычные ресурсы (PVC) созданы
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foodgram.name" . }}-frontend-build
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Очищаем старый билд
        - name: clean-build
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              rm -rf /output/* && echo "Build dir cleaned"
          volumeMounts:
            - name: frontend-build
              mountPath: /output
      containers:
        - name: frontend-build
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> Installing dependencies..."
              npm install
              echo "==> Building frontend..."
              npm run build
              echo "==> Copying build to shared volume..."
              cp -r /app/build/. /output/
              echo "==> Done! Files in /output:"
              ls -la /output/
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: frontend-build
              mountPath: /output
      volumes:
        - name: frontend-build
          persistentVolumeClaim:
            claimName: frontend-build-pvc
