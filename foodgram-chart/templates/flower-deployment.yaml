{{- if .Values.flower.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foodgram.fullname" . }}-flower
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  replicas: {{ .Values.flower.replicaCount }}
  selector:
    matchLabels:
      {{- include "foodgram.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: flower
  template:
    metadata:
      labels:
        {{- include "foodgram.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: flower
    spec:
      containers:
      - name: flower
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        command: ["celery"]
        args:
          - "-A"
          - "foodgram"
          - "flower"
          - "--port={{ .Values.flower.service.port }}"
          - "--broker=$(CELERY_BROKER_URL)"
          {{- if .Values.flower.prometheus.enabled }}
          - "--prometheus_metrics"
          {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "foodgram.fullname" . }}-config
        - secretRef:
            name: {{ include "foodgram.fullname" . }}-secret
        env:
        - name: NYT_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.nyt.secretName }}
              key: {{ .Values.nyt.apiKeyKey | default "NYT_API_KEY" }}
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
        ports:
          - containerPort: {{ .Values.flower.service.port }}
            name: http
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.flower.resources | nindent 10 }}
{{- end }}
