apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foodgram.fullname" . }}-nginx-config
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    {{ tpl (.Values.nginx.config | default (include "foodgram.nginxDefaultConfig" .)) . | nindent 4 }}
