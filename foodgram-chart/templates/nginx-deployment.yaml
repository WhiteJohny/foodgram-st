apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ include "foodgram.namespace" . }}
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      {{- include "foodgram.nginx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foodgram.nginx.selectorLabels" . | nindent 8 }}
    spec:
      # Ждём завершения Job перед стартом nginx
      initContainers:
        - name: wait-for-frontend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for frontend build..."
              until [ -f /usr/share/nginx/html/index.html ]; do
                echo "index.html not found yet, sleeping..."
                sleep 5
              done
              echo "Frontend build is ready!"
          volumeMounts:
            - name: frontend-build
              mountPath: /usr/share/nginx/html
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          imagePullPolicy: {{ .Values.nginx.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # Frontend build (из Job)
            - name: frontend-build
              mountPath: /usr/share/nginx/html
            # Django static
            - name: static
              mountPath: /app/static
            # Media (user uploads)
            - name: media
              mountPath: /app/media
            # Nginx конфиг из ConfigMap
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: frontend-build
          persistentVolumeClaim:
            claimName: frontend-build-pvc
        - name: static
          persistentVolumeClaim:
            claimName: static-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: nginx-config
          configMap:
            name: nginx-config
