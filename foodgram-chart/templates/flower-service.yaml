{{- if .Values.flower.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foodgram.fullname" . }}-flower
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
  {{- with .Values.flower.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.flower.service.type }}
  ports:
    - port: {{ .Values.flower.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "foodgram.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: flower
{{- end }}
