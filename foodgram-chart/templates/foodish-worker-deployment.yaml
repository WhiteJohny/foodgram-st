{{- if .Values.workers.foodish.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foodgram.fullname" . }}-foodish-worker
  labels:
    {{- include "foodgram.labels" . | nindent 4 }}
    app.kubernetes.io/component: foodish-worker
spec:
  replicas: {{ .Values.workers.foodish.replicaCount }}
  selector:
    matchLabels:
      {{- include "foodgram.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: foodish-worker
  template:
    metadata:
      labels:
        {{- include "foodgram.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: foodish-worker
    spec:
      containers:
      - name: worker
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        command: ["python"]
        args:
          - "workers/foodish_worker.py"
          - "--queue"
          - {{ .Values.workers.foodish.queue | quote }}
          - "--output-dir"
          - {{ .Values.workers.foodish.outputDir | quote }}
        env:
        - name: RABBITMQ_HOST
          value: {{ .Values.rabbitmq.host | default "my-rabbitmq.default.svc.cluster.local" | quote }}
        - name: RABBITMQ_PORT
          value: {{ .Values.rabbitmq.port | default "5672" | quote }}
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rabbitmq.secretName }}
              key: {{ .Values.rabbitmq.userKey | default "username" }}
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rabbitmq.secretName }}
              key: {{ .Values.rabbitmq.passwordKey | default "password" }}
        volumeMounts:
        - name: output
          mountPath: {{ .Values.workers.foodish.outputDir }}
        resources:
          {{- toYaml .Values.workers.foodish.resources | nindent 10 }}
      volumes:
      - name: output
        {{- if .Values.workers.foodish.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "foodgram.fullname" . }}-foodish-output
        {{- else }}
        emptyDir: {}
        {{- end }}
{{- end }}
